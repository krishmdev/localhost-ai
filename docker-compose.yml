# docker compose -p lhai up --build -d
# Host ports default to 8410 (API), 9410 (Prometheus), 3410 (Grafana); override in .env.
name: lhai

services:
  server:
    build: .
    image: localhost-ai:cpu
    environment:
      LHAI_MODEL: ${LHAI_MODEL:-smollm2-135m}
      LHAI_DEVICE: ${LHAI_DEVICE:-cpu}
      LHAI_CONTROLLER: ${LHAI_CONTROLLER:-aimd}
      LHAI_SLO_TPOT_MS: ${LHAI_SLO_TPOT_MS:-100}
      LHAI_MAX_BATCH: ${LHAI_MAX_BATCH:-64}
      LHAI_ADMIN_TOKEN: ${LHAI_ADMIN_TOKEN:-}
    volumes:
      - ./.models:/models:ro
    mem_limit: ${LHAI_MEM_LIMIT:-4g}
    memswap_limit: ${LHAI_MEM_LIMIT:-4g}
    cpus: ${LHAI_CPUS:-8}
    restart: "no"
    networks: [internal]

  prometheus:
    image: prom/prometheus:v3.14.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=2d
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks: [internal]

  grafana:
    image: grafana/grafana:13.2.2
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/localhost-ai.json
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks: [internal]

  edge:
    image: nginx:1.29.1-alpine
    volumes:
      - ./deploy/edge/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "127.0.0.1:${LHAI_HOST_PORT:-8410}:8000"
      - "127.0.0.1:${PROMETHEUS_HOST_PORT:-9410}:9090"
      - "127.0.0.1:${GRAFANA_HOST_PORT:-3410}:3000"
    depends_on: [server, prometheus, grafana]
    networks: [internal, edge]

networks:
  internal:
    internal: true
  edge: {}
