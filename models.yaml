# Model presets. Every entry is pinned to a Hub commit; `make models` downloads the pinned files
# into .models/ and checks them against models.lock.
default: smollm2-135m
models:
  smollm2-135m:
    repo: HuggingFaceTB/SmolLM2-135M-Instruct
    revision: 12fd25f77366fa6b3b4b768ec3050bf629380bac
    license: apache-2.0
    max_new_tokens: 256
  smollm2-360m:
    repo: HuggingFaceTB/SmolLM2-360M-Instruct
    revision: a10cc1512eabd3dde888204e902eca88bddb4951
    license: apache-2.0
    max_new_tokens: 256
  qwen2.5-0.5b:
    repo: Qwen/Qwen2.5-0.5B-Instruct
    revision: 7ae557604adf67be50417f59c2c2f167def9a775
    license: apache-2.0
    dtype: bf16
    max_new_tokens: 256
  # Apple silicon, pre-quantized MLX checkpoints (needs `uv sync --extra mlx`)
  qwen2.5-0.5b-mlx4:
    repo: mlx-community/Qwen2.5-0.5B-Instruct-4bit
    revision: a5339a4131f135d0fdc6a5c8b5bbed2753bbe0f3
    license: apache-2.0
    backend: mlx
    quantization: mlx4
    max_new_tokens: 256
  # Hybrid gated-delta / full-attention model; the vision tower in the checkpoint is dropped on
  # load. Thinking is off so a chat request gets the answer, not a reasoning trace.
  qwen3.5-9b-mlx4:
    repo: mlx-community/Qwen3.5-9B-MLX-4bit
    revision: 938d8919941c6e7efd3c7150eff7fe9d12afa631
    license: apache-2.0
    backend: mlx
    quantization: mlx4
    chat_template_kwargs: {enable_thinking: false}
    max_new_tokens: 256
  # Gemma 4 E4B: sliding-window layers (512) with a full-attention layer every sixth, and the
  # last 18 layers reuse earlier layers' KV. Text only here, like the Qwen3.5 preset.
  gemma-4-e4b-mlx4:
    repo: mlx-community/gemma-4-e4b-it-4bit
    revision: 475b9088d29754a3379866cf5aeb6b41acd313c2
    license: gemma
    backend: mlx
    quantization: mlx4
    max_new_tokens: 256
