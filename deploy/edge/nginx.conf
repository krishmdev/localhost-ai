# The only container with a published port. It forwards TCP to services that sit on an
# internal-only network, so the model server, Prometheus and Grafana have no route out.
worker_processes 1;
events { worker_connections 1024; }
stream {
    server { listen 8000; proxy_pass server:8000; proxy_timeout 1h; }
    server { listen 9090; proxy_pass prometheus:9090; }
    server { listen 3000; proxy_pass grafana:3000; proxy_timeout 1h; }
}
