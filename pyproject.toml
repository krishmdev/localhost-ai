[project]
name = "localhost-ai"
version = "0.1.0"
description = "Local LLM inference server with continuous batching and an adaptive batch-size controller"
readme = "README.md"
license = "MIT"
authors = [{ name = "Krish Maheshwari" }]
requires-python = ">=3.11,<3.12"
dependencies = [
    "transformers==5.17.0",
    "safetensors==0.8.0",
    "huggingface-hub==1.32.0",
    "fastapi==0.141.1",
    "uvicorn[standard]==0.53.0",
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
    "prometheus-client==0.26.0",
    "psutil==7.2.2",
    "numpy==2.4.6",
    "typer==0.27.2",
    "pyyaml==6.0.3",
    "httpx==0.28.1",
    "websockets==17.1",
]

[project.optional-dependencies]
cpu = ["torch==2.14.0"]
cu126 = ["torch==2.14.0"]
cuda = ["bitsandbytes==0.50.2", "accelerate==1.15.0", "nvidia-ml-py==13.610.43"]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "openai==3.19.0",
    "ruff==0.16.8",
    "matplotlib==3.11.2",
]

[project.scripts]
lhai = "localhost_ai.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/localhost_ai"]

[tool.uv]
conflicts = [[{ extra = "cpu" }, { extra = "cu126" }]]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu126", extra = "cu126", marker = "sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["model: needs the pinned SmolLM2 weights in .models/ (run `make models` first)"]
addopts = "-m 'not model'"
filterwarnings = ["ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["B008", "SIM300"]
